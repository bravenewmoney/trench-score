[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trench-momentum"
version = "0.1.0"
description = "CLI that scores onchain momentum for low-cap tokens. Not a trading bot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
trench-momentum = "trench_momentum.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trench_momentum = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
